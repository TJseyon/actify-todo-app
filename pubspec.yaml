name: actify
description: Modern Task List App - Updated from actify

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

  # Firebase
  firebase_core: ^3.8.1
  firebase_analytics: ^11.3.8
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.3

  # UI Components
  flutter_colorpicker: ^1.1.0
  flutter_slidable: ^3.1.1
  modal_progress_hud_nsn: ^0.5.1

  # Utilities
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  in_app_review: ^2.0.9
  connectivity_plus: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/list.png